<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Console</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #0f1115;
        color: #e8eaed;
      }
      a {
        color: #8ab4f8;
      }
      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      .shell header {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #2a2f3a;
        display: flex;
        gap: 1.5rem;
        align-items: center;
      }
      .shell h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
      }
      .shell nav {
        display: flex;
        gap: 1rem;
      }
      .shell nav a.router-link-active {
        color: #fff;
        font-weight: 600;
      }
      .shell main {
        padding: 1.5rem;
      }
      .panel {
        max-width: 48rem;
        padding: 1rem 1.25rem;
        border: 1px solid #2a2f3a;
        border-radius: 8px;
        background: #171a21;
      }
      .panel code {
        word-break: break-all;
      }
      .panel pre {
        overflow: auto;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
