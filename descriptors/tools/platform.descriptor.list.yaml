schemaVersion: 1
kind: TOOL
name: platform.descriptor.list
version: 0.1.0
description: List the current tenant agent / skill / rule descriptors (read-only). Tenant is taken from the caller context, never from arguments.
displayName: List tenant descriptors
isPreset: true
meta:
  execution: LOCAL
  consent: NEVER
  requiresPrincipal: USER
  timeoutMs: 120000
  idempotent: true
  sideEffects:
    - read:platform.descriptor
inputSchema:
  type: object
  additionalProperties: false
  properties:
    kind:
      type: string
      enum: [agent, skill, rule]
      description: Descriptor kind to manage (tenant agent / skill / rule).
  required:
    - kind
outputSchema:
  type: object
  additionalProperties: true
  properties:
    items:
      type: array
requires:
  principal: USER
  oauthScope: []
  obo: null
execute: builtin:platform.descriptor.list
handler:
  kind: descriptorOps
  config: {}
category: PLATFORM
tags:
  - descriptor
  - management
  - platform
