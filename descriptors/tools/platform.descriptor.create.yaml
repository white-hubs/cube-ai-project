schemaVersion: 1
kind: TOOL
name: platform.descriptor.create
version: 0.1.0
description: Create a new tenant descriptor. Always produces a DRAFT (not live); publish separately to take effect.
displayName: Create a descriptor draft
isPreset: true
meta:
  execution: LOCAL
  consent: ON_FIRST_USE
  requiresPrincipal: USER
  timeoutMs: 120000
  idempotent: false
  sideEffects:
    - write:platform.descriptor
inputSchema:
  type: object
  additionalProperties: false
  properties:
    kind:
      type: string
      enum: [agent, skill, rule]
      description: Descriptor kind to manage (tenant agent / skill / rule).
    name:
      type: string
      description: Unique descriptor name within the kind.
    content:
      type: object
      additionalProperties: true
      description: Descriptor content object shaped by the target kind schema.
  required:
    - kind
    - name
    - content
outputSchema:
  type: object
  additionalProperties: true
  properties: {}
requires:
  principal: USER
  oauthScope: []
  obo: null
execute: builtin:platform.descriptor.create
handler:
  kind: descriptorOps
  config: {}
category: PLATFORM
tags:
  - descriptor
  - management
  - platform
