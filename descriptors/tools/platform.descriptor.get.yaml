schemaVersion: 1
kind: TOOL
name: platform.descriptor.get
version: 0.1.0
description: Fetch a single tenant descriptor by its prefixed id (read-only).
displayName: Get a tenant descriptor
isPreset: true
meta:
  execution: LOCAL
  consent: NEVER
  requiresPrincipal: USER
  timeoutMs: 120000
  idempotent: true
  sideEffects:
    - read:platform.descriptor
inputSchema:
  type: object
  additionalProperties: false
  properties:
    kind:
      type: string
      enum: [agent, skill, rule]
      description: Descriptor kind to manage (tenant agent / skill / rule).
    id:
      type: string
      description: Prefixed descriptor id (agt_/skl_/rul_).
  required:
    - id
outputSchema:
  type: object
  additionalProperties: true
  properties: {}
requires:
  principal: USER
  oauthScope: []
  obo: null
execute: builtin:platform.descriptor.get
handler:
  kind: descriptorOps
  config: {}
category: PLATFORM
tags:
  - descriptor
  - management
  - platform
