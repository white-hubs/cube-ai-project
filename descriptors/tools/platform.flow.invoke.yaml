schemaVersion: 1
kind: TOOL
name: platform.flow.invoke
version: 0.1.0
description: Invoke an AI middle-platform flow and return the immediate or job-tracked result.
displayName: Platform Flow Invoke
isPreset: true
meta:
  execution: LOCAL
  consent: ON_FIRST_USE
  requiresPrincipal: USER
  timeoutMs: 300000
  idempotent: false
  sideEffects:
    - invoke:platform.flow
inputSchema:
  type: object
  additionalProperties: false
  properties:
    flowId:
      type: string
      description: Flow definition ID from platform.flow.list flows[].flowId
      maxLength: 64
    variables:
      type: object
      description: Flow input variables; shape depends on the flow definition
      additionalProperties: true
  required:
    - flowId
outputSchema:
  type: object
  properties:
    result:
      type: object
      additionalProperties: true
    executionTrace:
      type: array
    traceTruncated:
      type: boolean
    partial:
      type: boolean
requires:
  principal: USER
  oauthScope: []
  obo: null
execute: builtin:platform.flow.invoke
category: PLATFORM
tags:
  - flow
  - platform
