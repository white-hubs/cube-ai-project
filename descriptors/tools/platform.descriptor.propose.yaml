schemaVersion: 1
kind: TOOL
name: platform.descriptor.propose
version: 0.1.0
description: "AI-author a descriptor content candidate (ADR-0027 ①). Pure suggestion, never persisted: returns a ready-to-create content envelope plus grounded ref suggestions."
displayName: Propose descriptor content
isPreset: true
meta:
  execution: LOCAL
  consent: NEVER
  requiresPrincipal: USER
  timeoutMs: 120000
  idempotent: false
  sideEffects:
    - read:platform.descriptor
inputSchema:
  type: object
  additionalProperties: false
  properties:
    kind:
      type: string
      enum: [agent, skill, rule]
      description: Descriptor kind to manage (tenant agent / skill / rule).
    intent:
      type: string
      description: Natural-language intent (generate mode).
    base:
      type: object
      additionalProperties: true
      description: Existing content (optimize mode).
    focus:
      type: string
      description: Optional instruction to focus the change.
    modelCode:
      type: string
      description: Optional authoring model override.
  required:
    - kind
outputSchema:
  type: object
  additionalProperties: true
  properties:
    content: {}
    suggestions:
      type: array
    valid:
      type: boolean
requires:
  principal: USER
  oauthScope: []
  obo: null
execute: builtin:platform.descriptor.propose
handler:
  kind: descriptorOps
  config: {}
category: PLATFORM
tags:
  - descriptor
  - management
  - platform
