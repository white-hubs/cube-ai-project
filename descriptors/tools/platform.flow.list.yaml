schemaVersion: 1
kind: TOOL
name: platform.flow.list
version: 0.1.0
description: List AI middle-platform flows configured for the tenant.
displayName: Platform Flow List
isPreset: true
meta:
  execution: LOCAL
  consent: NEVER
  requiresPrincipal: USER
  timeoutMs: 15000
  idempotent: true
  sideEffects:
    - read:platform.flow
inputSchema:
  type: object
  additionalProperties: false
  properties:
    keyword:
      type: string
    pageNumber:
      type: integer
      minimum: 1
    pageSize:
      type: integer
      minimum: 1
      maximum: 100
outputSchema:
  type: object
  properties:
    flows:
      type: array
    total:
      type: integer
requires:
  principal: USER
  oauthScope: []
  obo: null
execute: builtin:platform.flow.list
category: PLATFORM
tags:
  - flow
  - platform
