# cube-ai-center — 全内置运行时模板
#
# 面向 **共享部署环境** 的完整样本：ai-center + MySQL + Redis + Qdrant。
# OTel Collector 通过 `--profile otel` 可选启用。
#
# 用法：
#   cd deploy/runtime-compose/standalone
#   cp .env.example .env
#   docker compose up -d
#   ../../scripts/verify-ai-center-http.sh http://127.0.0.1:${AI_CENTER_HOST_PORT:-3000}

name: cube-ai-center-runtime-standalone

x-ai-center-env: &ai-center-env
  AI_CENTER_PORT: "${AI_CENTER_CONTAINER_PORT:-3000}"
  AI_CENTER_HOSTNAME: "0.0.0.0"
  DEPLOY_ENV: "${DEPLOY_ENV:-DEV}"
  AI_CENTER_VERSION: "${AI_CENTER_VERSION:-dev-local}"
  BUILD_SHA: "${BUILD_SHA:-local}"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"

  AGENTIC_ENGINE_MYSQL_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:${MYSQL_PORT}/${MYSQL_DB}"
  AGENTIC_ENGINE_REDIS_URL: "redis://redis:6379/0"
  AGENTIC_ENGINE_QDRANT_URL: "http://qdrant:6333"
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "${MYSQL_PORT}"
  MYSQL_USER: "${MYSQL_USER}"
  MYSQL_USERNAME: "${MYSQL_USERNAME:-${MYSQL_USER}}"
  MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
  MYSQL_DB: "${MYSQL_DB}"
  MYSQL_DATABASE: "${MYSQL_DATABASE:-${MYSQL_DB}}"
  REDIS_URL: "redis://redis:6379/0"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_BASE_URL: "http://qdrant:6333"

  NACOS_ADDRESS: "${NACOS_ADDRESS:-}"
  NACOS_SERVER_ADDR: "${NACOS_SERVER_ADDR:-${NACOS_ADDRESS:-}}"
  NACOS_NAMESPACE_ID: "${NACOS_NAMESPACE_ID:-${NACOS_NAMESPACE:-}}"
  NACOS_NAMESPACE: "${NACOS_NAMESPACE:-}"
  NACOS_USERNAME: "${NACOS_USERNAME:-}"
  NACOS_PASSWORD: "${NACOS_PASSWORD:-}"

  AGENTIC_ENGINE_AUTH_MODE: "${AGENTIC_ENGINE_AUTH_MODE:-mock}"
  USE_GHCLOUD_IDENTITY: "${USE_GHCLOUD_IDENTITY:-0}"
  JWT_KEY_URL: "${JWT_KEY_URL:-}"

  AGENTIC_ENGINE_PROVIDER: "${AGENTIC_ENGINE_PROVIDER:-agentic-platform-llm-catalog}"
  CUBE_AI_CATALOG_DEV_SEED: "${CUBE_AI_CATALOG_DEV_SEED:-}"

  AGENTIC_ENGINE_TOOL_DESCRIPTOR_DIR: "/app/descriptors/"
  AGENTIC_ENGINE_AGENT_DESCRIPTOR_DIR: "/app/descriptors/agents"
  AGENTIC_ENGINE_SKILL_DESCRIPTOR_DIR: "/app/descriptors/skills"
  AGENTIC_ENGINE_GLOBAL_PROMPT_PATH: "/app/CUBE.md"
  AGENTIC_ENGINE_MCP_SERVERS_CONFIG: "/app/config/mcp-servers.json"
  AGENTIC_ENGINE_LOCAL_FILE_DIR: "/var/lib/ai-center/local-files"

  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
  OTEL_SERVICE_NAME: "cube-ai-center"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${DEPLOY_ENV:-DEV},service.version=${AI_CENTER_VERSION:-dev-local}"

services:
  mysql:
    image: mysql:8.4.6
    container_name: ai-center-runtime-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_runtime_only}"
      MYSQL_DATABASE: "${MYSQL_DB:-cube_ai_center}"
      MYSQL_USER: "${MYSQL_USER:-agentic_engine}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-agentic_engine_runtime}"
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../docker-compose/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_runtime_only}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8-alpine
    container_name: ai-center-runtime-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: ai-center-runtime-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: ai-center-runtime-otel
    restart: unless-stopped
    profiles: ["otel"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_HOST_PORT:-4317}:4317"
      - "${OTEL_HTTP_HOST_PORT:-4318}:4318"

  ai-center:
    image: ${AI_CENTER_IMAGE:?Set AI_CENTER_IMAGE to a pushed release image tag}
    container_name: ai-center-runtime
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *ai-center-env
    ports:
      - "${AI_CENTER_HOST_PORT:-3000}:${AI_CENTER_CONTAINER_PORT:-3000}"
    volumes:
      - ${DESCRIPTORS_DIR:-../../../descriptors}:/app/descriptors:ro
      - ${CONFIG_DIR:-../../../config}:/app/config:ro
      - ${GLOBAL_PROMPT_FILE:-../../../packages/agent/engine/CUBE.md}:/app/CUBE.md:ro
      - ai-center-local-files:/var/lib/ai-center/local-files
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${AI_CENTER_CONTAINER_PORT:-3000}/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  ai-center-local-files:
  mysql-data:
  redis-data:
  qdrant-data:
