# ai-center — Local Dev Stack (ADR-0009)
#
# 默认假设 MySQL / Redis / Qdrant 为外部已有服务（host / 内网 / 云上）。
# 本机无依赖时用 `--profile deps` 起容器。
#
# 用法（仓库根）：
#   bun run dev:up:deps              # 仅依赖
#   bun run dev:up                   # deps + ai-center（容器内源码形态）
#   bun run dev:up:prebuilt          # host 编译二进制 + deps + ai-center-prebuilt
#   cd apps/ai-center && bun run dev # host 直跑（配合 dev:up:deps）
#
# ref:
#   - scripts/build-host-binary.sh
#   - deploy/docker-compose/Dockerfile.ai-center

name: cube-ai-project

x-ai-center-base: &ai-center-base
  env_file:
    - .env
  restart: unless-stopped
  volumes:
    - ../../descriptors:/app/descriptors:ro
    - ../../config:/app/config:ro
    - ../../packages/agent/engine/CUBE.md:/app/CUBE.md:ro
    # flow-core 图翻译依赖 api-all；prebuilt 镜像不含 /app/data，须挂载或见 Dockerfile COPY
    - ../../packages/flow/core/data/langflow-api-all.json:/app/data/langflow-api-all.json:ro
    - ../../packages/flow/core/generated/cube-component-catalog.json:/app/data/cube-component-catalog.json:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-ai-center-http: &ai-center-http
  ports:
    - "${AI_CENTER_HOST_PORT:-3000}:${AI_CENTER_PORT:-3000}"
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:${AI_CENTER_PORT:-3000}/health/live || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 45s

x-ai-center-env: &ai-center-env
  AI_CENTER_PORT: "${AI_CENTER_PORT:-3000}"
  AI_CENTER_HOSTNAME: "0.0.0.0"
  AGENTIC_ENGINE_MYSQL_URL: "mysql://${MYSQL_USER:-agentic_engine}:${MYSQL_PASSWORD:-agentic_engine_dev}@${MYSQL_HOST:-host.docker.internal}:${MYSQL_PORT:-3306}/${MYSQL_DB:-agentic_engine}"
  AGENTIC_ENGINE_REDIS_URL: "${REDIS_URL:-redis://host.docker.internal:6379/0}"
  AGENTIC_ENGINE_QDRANT_URL: "${QDRANT_URL:-http://host.docker.internal:6333}"
  MYSQL_HOST: "${MYSQL_HOST:-host.docker.internal}"
  MYSQL_PORT: "${MYSQL_PORT:-3306}"
  MYSQL_USER: "${MYSQL_USER:-agentic_engine}"
  MYSQL_USERNAME: "${MYSQL_USERNAME:-${MYSQL_USER:-agentic_engine}}"
  MYSQL_PASSWORD: "${MYSQL_PASSWORD:-agentic_engine_dev}"
  MYSQL_DATABASE: "${MYSQL_DATABASE:-${MYSQL_DB:-agentic_engine}}"
  MYSQL_DB: "${MYSQL_DB:-agentic_engine}"
  REDIS_URL: "${REDIS_URL:-redis://host.docker.internal:6379/0}"
  QDRANT_URL: "${QDRANT_URL:-http://host.docker.internal:6333}"
  QDRANT_BASE_URL: "${QDRANT_BASE_URL:-${QDRANT_URL:-http://host.docker.internal:6333}}"
  AGENTIC_ENGINE_TOOL_DESCRIPTOR_DIR: "/app/descriptors/"
  AGENTIC_ENGINE_AGENT_DESCRIPTOR_DIR: "/app/descriptors/agents"
  AGENTIC_ENGINE_SKILL_DESCRIPTOR_DIR: "/app/descriptors/skills"
  AGENTIC_ENGINE_GLOBAL_PROMPT_PATH: "/app/CUBE.md"
  AGENTIC_ENGINE_MCP_SERVERS_CONFIG: "/app/config/mcp-servers.json"
  NACOS_ADDRESS: "${NACOS_ADDRESS:-${NACOS_SERVER_ADDR:-}}"
  NACOS_SERVER_ADDR: "${NACOS_SERVER_ADDR:-}"
  NACOS_NAMESPACE_ID: "${NACOS_NAMESPACE_ID:-${NACOS_NAMESPACE:-}}"
  NACOS_NAMESPACE: "${NACOS_NAMESPACE:-}"
  NACOS_USERNAME: "${NACOS_USERNAME:-}"
  NACOS_PASSWORD: "${NACOS_PASSWORD:-}"
  CUBE2_CONTENT_SERVICE_BASE_URL: "${CUBE2_CONTENT_SERVICE_BASE_URL:-}"
  CUBE2_CONTENT_SERVICE_NAME: "${CUBE2_CONTENT_SERVICE_NAME:-}"
  CUBE2_CONTENT_SERVICE_GROUP: "${CUBE2_CONTENT_SERVICE_GROUP:-DEFAULT_GROUP}"
  CUBE2_FILE_SERVICE_BASE_URL: "${CUBE2_FILE_SERVICE_BASE_URL:-}"
  CUBE2_FILE_SERVICE_NAME: "${CUBE2_FILE_SERVICE_NAME:-}"
  CUBE2_FILE_SERVICE_GROUP: "${CUBE2_FILE_SERVICE_GROUP:-DEFAULT_GROUP}"
  CUBE2_INTERNAL_INVOKE_SECRET_KEY: "${CUBE2_INTERNAL_INVOKE_SECRET_KEY:-}"
  CUBE2_INTERNAL_INVOKE_TIMEOUT_SEC: "${CUBE2_INTERNAL_INVOKE_TIMEOUT_SEC:-60}"
  CUBE2_OUAA_OAUTH2_TOKEN_URL: "${CUBE2_OUAA_OAUTH2_TOKEN_URL:-${OUAA_OAUTH2_TOKEN_URL:-}}"
  CUBE2_OUAA_CLIENT_ID: "${CUBE2_OUAA_CLIENT_ID:-${OUAA_REGISTRATION_CLIENT_ID:-}}"
  CUBE2_OUAA_CLIENT_SECRET: "${CUBE2_OUAA_CLIENT_SECRET:-${OUAA_REGISTRATION_CLIENT_SECRET:-}}"

services:
  mysql:
    image: mysql:8.4.6
    container_name: ai-center-mysql
    restart: unless-stopped
    profiles: ["deps"]
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_dev_only}"
      MYSQL_DATABASE: "${MYSQL_DB:-agentic_engine}"
      MYSQL_USER: "${MYSQL_USER:-agentic_engine}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-agentic_engine_dev}"
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev_only}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8-alpine
    container_name: ai-center-redis
    restart: unless-stopped
    profiles: ["deps"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: ai-center-qdrant
    restart: unless-stopped
    profiles: ["deps"]
    ports:
      - "${QDRANT_HTTP_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── KB 真实闭环可选依赖（profile: kb）────────────────────────────────────────
  # 对象存储：文档原文落地（DocumentService → ObjectStorageService）。
  # 启用：在 .env 取消注释 MINIO_* 块；起栈：docker compose --profile deps --profile kb up -d
  minio:
    image: minio/minio:latest
    container_name: ai-center-minio
    restart: unless-stopped
    profiles: ["kb"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  # 一次性建桶（mc），失败自动重试到 minio 就绪。
  minio-setup:
    image: minio/mc:latest
    container_name: ai-center-minio-setup
    profiles: ["kb"]
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_KB_BUCKET: "${MINIO_KB_BUCKET:-kb-documents}"
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo 'waiting minio...'; sleep 2;
        done;
        mc mb -p "local/$$MINIO_KB_BUCKET" || true;
        echo "minio bucket $$MINIO_KB_BUCKET ready";

  # 文档解析（PDF/DOCX/PPTX 等 → 结构化分块）。缺失时 KB 回退到纯 JS 解析器（保真度较低）。
  # 注意：镜像/tag 请按你的环境确认并锁定版本。
  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: ai-center-docling
    restart: unless-stopped
    profiles: ["kb"]
    ports:
      - "${DOCLING_HOST_PORT:-5001}:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"

  # ── Flow 真实闭环可选依赖（profile: flow）─────────────────────────────────────
  # 执行后端（生产对齐路径）。启用：.env 设 LANGFLOW_BASE_URL=http://langflow:7860；
  # 起栈：docker compose --profile deps --profile flow up -d
  # 注意：镜像/tag 请按你的环境确认并锁定版本。
  langflow:
    image: langflowai/langflow:latest
    container_name: ai-center-langflow
    restart: unless-stopped
    profiles: ["flow"]
    environment:
      LANGFLOW_AUTO_LOGIN: "true"
    ports:
      - "${LANGFLOW_HOST_PORT:-7860}:7860"
    volumes:
      - langflow-data:/app/langflow

  ai-center:
    <<: [*ai-center-base, *ai-center-http]
    profiles: ["ai-center"]
    container_name: ai-center
    image: ${AI_CENTER_IMAGE:-cube-ai-project:ai-center-dev}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.ai-center
      target: ${AI_CENTER_BUILD_TARGET:-runtime-source}
      args:
        AI_CENTER_VERSION: ${AI_CENTER_VERSION:-dev-local}
        BUILD_SHA: ${BUILD_SHA:-local}
        BUILD_CREATED: ${BUILD_CREATED:-2026-01-01T00:00:00Z}
    environment:
      <<: *ai-center-env

  # 跳过容器内 bun install / bun build，直接 COPY 宿主机 dist/ai-center。
  # 启动前须：bun run build:host-binary（或 dev:up:prebuilt 自动执行）
  ai-center-prebuilt:
    <<: [*ai-center-base, *ai-center-http]
    profiles: ["ai-center-prebuilt"]
    container_name: ai-center-prebuilt
    image: ${AI_CENTER_PREBUILT_IMAGE:-cube-ai-project:ai-center-prebuilt}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.ai-center
      target: runtime-binary-prebuilt
      args:
        AI_CENTER_VERSION: ${AI_CENTER_VERSION:-dev-local-prebuilt}
        BUILD_SHA: ${BUILD_SHA:-local}
        BUILD_CREATED: ${BUILD_CREATED:-2026-01-01T00:00:00Z}
    environment:
      <<: *ai-center-env
    volumes:
      - ../../descriptors:/app/descriptors:ro
      - ../../config:/app/config:ro
      - ../../packages/agent/engine/CUBE.md:/app/CUBE.md:ro
      - ../../packages/flow/core/data/langflow-api-all.json:/app/data/langflow-api-all.json:ro
      - ../../packages/flow/core/generated/cube-component-catalog.json:/app/data/cube-component-catalog.json:ro

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  minio-data:
  langflow-data:
